name: Build FlexKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: gradle wrapper

      - name: Grant Executable Permissions
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Updated with your exact package name: com.aistudio.flexkey.kbd
      - name: Create Dummy google-services.json
        run: |
          echo '{
            "project_info": { "project_number": "000000000000", "project_id": "flexkey-dummy" },
            "client": [{
              "client_info": { 
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000", 
                "android_client_info": { "package_name": "com.aistudio.flexkey.kbd" } 
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy_key" }]
            }]
          }' > app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlexKey-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
