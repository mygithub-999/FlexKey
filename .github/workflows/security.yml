name: Full Security & SAST Audit

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  semgrep:
    name: Code Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
          
 mobsf:
    name: Android Security Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run MobSF Static Analysis
        uses: MobSF/mobsfscan@main
        with:
          args: '. --sarif --output mobsf-results.sarif --no-fail'
      - name: Upload MobSF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: mobsf-results.sarif
